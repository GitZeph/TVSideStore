name: ATVStore
options:
  bundleIdPrefix: com.atvstore
  deploymentTarget:
    tvOS: "17.0"
  xcodeVersion: "15.0"
  projectFormat: xcode15_0
  createIntermediateGroups: true

settings:
  base:
    PRODUCT_NAME: ATVStore
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "3"
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  ATVStore:
    type: application
    platform: tvOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
      - path: Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.atvstore.SideStoreTV
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/ATVStoreApp.entitlements
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Core/ATVStore-Bridging-Header.h
        HEADER_SEARCH_PATHS:
          - $(SRCROOT)/../rust-core/include
          - $(SRCROOT)/../cpp-signer/include
        FRAMEWORK_SEARCH_PATHS:
          - $(SRCROOT)/../Frameworks
          - $(SRCROOT)/Frameworks
        OTHER_LDFLAGS:
          - -lz
          - -lc++
    dependencies:
      - framework: ../Frameworks/ATVStoreCore.xcframework
        embed: false
      - sdk: Security.framework
      - sdk: Network.framework
      - sdk: CoreImage.framework
      - sdk: libz.tbd
      - sdk: libc++.tbd

