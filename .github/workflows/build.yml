name: Build SideStoreTV IPA (tvOS)

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ipa:
    name: Build tvOS Application & IPA
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          for app in /Applications/Xcode_16*.app /Applications/Xcode_15*.app; do
            if [ -d "$app" ]; then
              echo "Selecting $app"
              sudo xcode-select -s "$app"
              break
            fi
          done
          xcodebuild -version

      - name: Setup Rust Nightly (-Z build-std for Tier 3 tvOS)
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: Install Build Tools
        run: |
          brew install xcodegen cmake

      - name: Prepare C FFI Headers
        run: |
          cp cpp-signer/include/zsign_bridge.h rust-core/include/

      - name: Compile Rust Core for tvOS Device & Simulator
        run: |
          cargo +nightly build -Z build-std=std,panic_abort --target aarch64-apple-tvos --release --manifest-path rust-core/Cargo.toml
          cargo +nightly build -Z build-std=std,panic_abort --target aarch64-apple-tvos-sim --release --manifest-path rust-core/Cargo.toml

      - name: Compile C++ Signer for tvOS Device & Simulator
        run: |
          mkdir -p cpp-signer/build-tvos cpp-signer/build-sim

          cmake -B cpp-signer/build-tvos -S cpp-signer \
            -DCMAKE_SYSTEM_NAME=tvOS \
            -DCMAKE_OSX_SYSROOT=appletvos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build cpp-signer/build-tvos --config Release

          cmake -B cpp-signer/build-sim -S cpp-signer \
            -DCMAKE_SYSTEM_NAME=tvOS \
            -DCMAKE_OSX_SYSROOT=appletvsimulator \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build cpp-signer/build-sim --config Release

      - name: Assemble ATVStoreCore.xcframework
        run: |
          mkdir -p build/combined-tvos build/combined-sim Frameworks ATVStoreApp/Frameworks

          RUST_TVOS_LIB=$(find rust-core/target target -name "libatv_store_core.a" 2>/dev/null | grep "aarch64-apple-tvos/" | head -n 1)
          RUST_SIM_LIB=$(find rust-core/target target -name "libatv_store_core.a" 2>/dev/null | grep "aarch64-apple-tvos-sim/" | head -n 1)
          CPP_TVOS_LIB=$(find cpp-signer/build-tvos -name "libzsign_static.a" | head -n 1)
          CPP_SIM_LIB=$(find cpp-signer/build-sim -name "libzsign_static.a" | head -n 1)

          echo "Combining tvOS Device: $RUST_TVOS_LIB + $CPP_TVOS_LIB"
          libtool -static -o build/combined-tvos/libATVStoreCore.a "$RUST_TVOS_LIB" "$CPP_TVOS_LIB"

          echo "Combining tvOS Simulator: $RUST_SIM_LIB + $CPP_SIM_LIB"
          libtool -static -o build/combined-sim/libATVStoreCore.a "$RUST_SIM_LIB" "$CPP_SIM_LIB"

          rm -rf Frameworks/ATVStoreCore.xcframework ATVStoreApp/Frameworks/ATVStoreCore.xcframework

          xcodebuild -create-xcframework \
            -library build/combined-tvos/libATVStoreCore.a -headers rust-core/include \
            -library build/combined-sim/libATVStoreCore.a -headers rust-core/include \
            -output Frameworks/ATVStoreCore.xcframework

          cp -r Frameworks/ATVStoreCore.xcframework ATVStoreApp/Frameworks/

      - name: Generate Xcode Project via XcodeGen
        run: |
          cd ATVStoreApp
          xcodegen generate
          # Safeguard: if objectVersion 77 was generated for Xcode 15 runner, adapt it
          if [ -f ATVStore.xcodeproj/project.pbxproj ]; then
            sed -i '' 's/objectVersion = 77;/objectVersion = 56;/g' ATVStore.xcodeproj/project.pbxproj || true
          fi

      - name: Build ATVStore.app with xcodebuild
        run: |
          xcodebuild build \
            -project ATVStoreApp/ATVStore.xcodeproj \
            -scheme ATVStore \
            -configuration Release \
            -sdk appletvos \
            -destination 'generic/platform=tvOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Package ATVStore.ipa
        run: |
          mkdir -p build/Payload
          APP_PATH=$(find build/DerivedData -name "ATVStore.app" -type d | head -n 1)
          echo "Found compiled app at: $APP_PATH"
          cp -r "$APP_PATH" build/Payload/
          cd build && zip -qr ../ATVStore.ipa Payload
          cd ..
          ls -la ATVStore.ipa

      - name: Upload ATVStore.ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ATVStore.ipa
          path: ATVStore.ipa
          if-no-files-found: error

      - name: Create Release (on Tag or Manual Dispatch)
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: ATVStore.ipa
          tag_name: ${{ github.ref_name || 'v1.0.0' }}
          name: "SideStoreTV ${{ github.ref_name || 'v1.0.0' }}"
          body: "Automated production build of SideStoreTV (ATVStore) for Apple TV (tvOS 17+)."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
